<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}} 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style nonce="{{nonce}}">
  /* The CSP blocks inline style="" attributes, so colors and depths are classes. */
  .c-system_prompt { --cat: #9d9d9d; } .c-tools { --cat: var(--vscode-charts-purple, #b180d7); } .c-rules { --cat: var(--vscode-charts-green, #89d185); }
  .c-skills { --cat: var(--vscode-charts-yellow, #cca700); } .c-mcp { --cat: #e27bb1; } .c-subagents { --cat: var(--vscode-charts-blue, #3794ff); }
  .c-summarized_conversation { --cat: #4ec9d6; } .c-conversation { --cat: var(--vscode-charts-orange, #d18616); }
  .c-sent_context { --cat: var(--vscode-charts-red, #f14c4c); } .c-raw, .c-chats { --cat: #8a8a8a; }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: 13px; color: var(--vscode-foreground); background: var(--vscode-editor-background); }
  .muted { color: var(--vscode-descriptionForeground); }
  button { font: inherit; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button.on { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  button.ghost { background: transparent; color: var(--vscode-foreground); }
  button.ghost:hover { background: var(--vscode-toolbar-hoverBackground, #ffffff14); }
  select { min-width: 0; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); padding: 3px; border-radius: 3px; }
  svg.i { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

  /* Layout: the report alone, or the report beside the text of the selected row. */
  .app { display: grid; grid-template-columns: 1fr; height: 100vh; }
  .app.split { grid-template-columns: minmax(400px, 1fr) minmax(0, 1.3fr); }
  .report { overflow: auto; min-height: 0; scrollbar-gutter: stable; }
  .page { max-width: 748px; margin: 0 auto; padding: 16px 24px 56px; display: flex; flex-direction: column; gap: 20px; }
  .viewer { display: none; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--vscode-panel-border); }
  .app.split .viewer { display: flex; }
  @media (max-width: 900px) {
    .app.split { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .app.split .viewer { border-left: none; border-top: 1px solid var(--vscode-panel-border); }
  }

  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar select { flex: 1; }
  label.follow { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--vscode-descriptionForeground); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; }
  .crumbs:empty { display: none; }
  .crumb { color: var(--vscode-textLink-foreground); cursor: pointer; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb:hover { text-decoration: underline; }
  .crumb-sep { color: var(--vscode-descriptionForeground); }

  /* Header */
  .head { display: flex; flex-direction: column; gap: 24px; }
  .titles { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .eyebrow, .chunk .k, .donut .cap { font-size: 13px; line-height: 18px; color: var(--vscode-descriptionForeground); }
  .big { font-size: 24px; line-height: 30px; font-weight: 400; }
  .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chunks { display: flex; gap: 24px; min-width: 0; }
  .chunk { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .chunk .v { font-size: 15px; line-height: 20px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prose { line-height: 1.55; color: var(--vscode-descriptionForeground); margin: 0; }

  /* Donut */
  .donut { position: relative; width: 240px; height: 240px; margin: 16px auto; }
  .donut svg { display: block; }
  .arc { fill: none; stroke: var(--cat); cursor: pointer; transition: opacity 120ms ease; }
  .arc.rest { stroke: color-mix(in srgb, var(--vscode-foreground) 10%, transparent); cursor: default; }
  .donut.hovering .arc:not(.hot) { opacity: .4; }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
  .donut .pct { font-variant-numeric: tabular-nums; }
  .donut .cap { max-width: 160px; text-align: center; }

  .callout { border: 1px solid var(--vscode-editorWarning-foreground, #cca700); background: color-mix(in srgb, var(--vscode-editorWarning-foreground, #cca700) 10%, transparent); border-radius: 6px; padding: 10px 12px; line-height: 1.5; }
  .callout b { display: block; margin-bottom: 2px; }
  .rule { height: 1px; background: var(--vscode-panel-border); }
  .explorer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .explorer-head .actions { display: flex; gap: 8px; flex: none; }
  .sections { display: flex; flex-direction: column; gap: 6px; }

  /* Category sections and tree rows: full-width rows, nesting by inner left padding. */
  .sec-head, .trow { display: flex; align-items: center; column-gap: 12px; width: 100%; min-width: 0; min-height: 36px; padding: 0 12px; border-radius: 6px; cursor: pointer; user-select: none; }
  .sec-head { background: color-mix(in srgb, var(--cat) 6%, color-mix(in srgb, var(--vscode-foreground) 5%, transparent)); }
  .sec-head:hover { background: color-mix(in srgb, var(--cat) 10%, color-mix(in srgb, var(--vscode-foreground) 8%, transparent)); }
  .sec-head.hot { outline: 1px solid color-mix(in srgb, var(--cat) 60%, transparent); }
  .trow { min-height: 32px; }
  .trow:hover { background: var(--vscode-list-hoverBackground); }
  .trow.selected, .sec-head.selected { background: var(--vscode-list-inactiveSelectionBackground, var(--vscode-list-hoverBackground)); }
  .box { width: 20px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
  .chev svg { width: 16px; height: 16px; fill: var(--vscode-descriptionForeground); stroke: none; transition: transform 120ms ease; }
  .open > .chev svg, .chev.open svg { transform: rotate(90deg); }
  .sec-head .ico { color: var(--cat); }
  .trow .ico { color: var(--vscode-descriptionForeground); }
  .label { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 6px; }
  .label .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label .count, .label .snippet { flex: none; color: var(--vscode-descriptionForeground); }
  .label .snippet { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tok { flex: none; color: var(--vscode-descriptionForeground); font-variant-numeric: tabular-nums; }
  .show-text { flex: none; padding: 1px 6px; font-size: 11px; opacity: 0; }
  .sec-head:hover .show-text, .sec-head.selected .show-text { opacity: 1; }
  .dim .name { opacity: .6; }
  .badge { flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; white-space: nowrap; }
  .badge.type { background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
  .badge.sub { border: 1px solid var(--vscode-textLink-foreground); color: var(--vscode-textLink-foreground); cursor: pointer; }
  .badge.sub:hover { background: color-mix(in srgb, var(--vscode-textLink-foreground) 20%, transparent); }
  .badge.untracked { border: 1px solid var(--vscode-editorWarning-foreground, #cca700); color: var(--vscode-editorWarning-foreground, #cca700); }
  .sec-body { padding-top: 4px; }
  .sec-desc { padding: 12px 12px 4px 18px; margin-bottom: 8px; line-height: 1.55; color: var(--vscode-descriptionForeground); }
  .sec-desc .note { display: block; margin-top: 6px; font-size: 12px; }
  .kids { position: relative; display: flex; flex-direction: column; gap: 2px; }
  .kids.guide::before { content: ''; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--vscode-tree-indentGuidesStroke, color-mix(in srgb, var(--vscode-foreground) 15%, transparent)); }
  .d0 { padding-left: 12px; } .d1 { padding-left: 44px; } .d2 { padding-left: 76px; } .d3 { padding-left: 108px; } .d4 { padding-left: 140px; }
  .d5 { padding-left: 172px; } .d6 { padding-left: 204px; } .d7 { padding-left: 236px; } .d8 { padding-left: 268px; }
  .kids.g0::before { left: 22px; } .kids.g1::before { left: 54px; } .kids.g2::before { left: 86px; } .kids.g3::before { left: 118px; }
  .kids.g4::before { left: 150px; } .kids.g5::before { left: 182px; } .kids.g6::before { left: 214px; } .kids.g7::before { left: 246px; }
  .empty-note { padding: 4px 12px 8px 50px; color: var(--vscode-descriptionForeground); font-size: 12px; }

  /* Viewer */
  .viewer-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--vscode-panel-border); }
  .viewer-head .vt { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-head .vm { color: var(--vscode-descriptionForeground); white-space: nowrap; }
  input.find { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent); padding: 3px 6px; width: 150px; }
  #view { flex: 1; overflow: auto; min-height: 0; }
  mark { background: var(--vscode-editor-findMatchHighlightBackground, #f5d76e66); color: inherit; border-radius: 2px; }
  mark.current { outline: 1px solid var(--vscode-editor-findMatchBorder, #f5d76e); }
  .empty { color: var(--vscode-descriptionForeground); padding: 24px; }
  .error { color: var(--vscode-errorForeground); white-space: pre-wrap; }
  .error:empty { display: none; }

  /* Text view: the exact characters, colored, with nested tag contents indented visually. */
  .code { padding: 12px 0 40px; font-family: var(--vscode-editor-font-family); font-size: var(--vscode-editor-font-size); line-height: 1.5; }
  .ln { white-space: pre-wrap; word-break: break-word; padding-right: 16px; min-height: 1.5em; }
  .ln:hover { background: var(--vscode-editor-lineHighlightBackground, #ffffff08); }
  .code .d0 { padding-left: 16px; }
  .code.indent .d1 { padding-left: 34px; } .code.indent .d2 { padding-left: 52px; } .code.indent .d3 { padding-left: 70px; }
  .code.indent .d4 { padding-left: 88px; } .code.indent .d5 { padding-left: 106px; } .code.indent .d6 { padding-left: 124px; }
  .code.indent .d7 { padding-left: 142px; } .code.indent .d8 { padding-left: 160px; }
  .code:not(.indent) .ln { padding-left: 16px; }
  .t-punct { color: #808080; }
  .t-tag { color: var(--vscode-debugTokenExpression-name, #569cd6); }
  .t-attr { color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe); }
  .t-val { color: var(--vscode-debugTokenExpression-string, #ce9178); }
  .t-h { color: #e5c07b; font-weight: 600; }
  .t-bullet { color: #c678dd; }
  .t-strong { font-weight: 600; color: #e6e6e6; }
  .t-em { font-style: italic; }
  .t-code { color: #98c379; }
  .t-fence { color: #7f848e; }
  .t-quote { color: #7f848e; font-style: italic; }
  .t-link { color: var(--vscode-textLink-foreground); }
  .t-label { color: #c678dd; font-weight: 600; }
  .t-divider { color: #e5c07b; font-weight: 600; }
  .t-key { color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe); } .t-str { color: var(--vscode-debugTokenExpression-string, #ce9178); }
  .t-num { color: var(--vscode-debugTokenExpression-number, #b5cea8); } .t-lit { color: var(--vscode-debugTokenExpression-boolean, #569cd6); }
  .t-table { color: #7f848e; }

  /* Folding: click a multi-line tag's opening to hide everything up to its closing tag. */
  .ln.hid { display: none; }
  .fold-tag { cursor: pointer; border-radius: 3px; }
  .fold-tag:hover { background: color-mix(in srgb, var(--vscode-textLink-foreground) 18%, transparent); }
  .fold-chev { display: inline-block; width: 14px; margin-left: -14px; text-align: center; font-size: 10px; color: var(--vscode-descriptionForeground); opacity: .35; user-select: none; }
  .fold-chev::before { content: '▾'; }
  .ln:hover .fold-chev, .folded .fold-chev { opacity: 1; }
  .folded .fold-chev::before { content: '▸'; }
  .fold-ph { display: none; margin-left: 6px; padding: 0 6px; border-radius: 3px; font-size: .9em; cursor: pointer; user-select: none;
    color: var(--vscode-descriptionForeground); background: var(--vscode-badge-background, #ffffff14); }
  .fold-ph:hover { color: var(--vscode-foreground); }
  .folded .fold-ph { display: inline-block; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="report">
    <div class="page">
      <div class="toolbar">
        <select id="chat" title="Chat"></select>
        <button id="refresh" title="Refresh and show the focused chat">↻</button>
        <label class="follow"><input type="checkbox" id="follow"> Follow the focused chat</label>
      </div>
      <div id="err" class="error"></div>
      <div id="report"></div>
    </div>
  </div>
  <div class="viewer">
    <div class="viewer-head">
      <span class="vt" id="vt">Select a category or item</span>
      <span class="vm" id="vm"></span>
      <button id="indent" class="on" title="Indent the contents of nested tags (display only; copy keeps the original text)">Indent</button>
      <input class="find" id="find" placeholder="Find (Enter = next)">
      <button id="copy" disabled>Copy</button>
      <button id="open" disabled>Open in editor</button>
      <button id="close" class="ghost" title="Close the text">✕</button>
    </div>
    <div id="view"><div class="empty">Click any row to see the exact text the agent received for it.</div></div>
  </div>
</div>
<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  const state = Object.assign({ open: {}, selected: undefined, indent: true, folds: {} }, vscode.getState() || {});
  let ctx, currentText = '', currentKind = '', findIndex = 0;

  const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : String(n ?? 0));
  const full = (n) => Math.round(n || 0).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const save = () => vscode.setState(state);

  window.addEventListener('message', ({ data: m }) => {
    if (m.type === 'context') { $('err').textContent = ''; ctx = m.context; renderChats(m.chats); $('follow').checked = m.follow; render(); if (state.selected) select(state.selected, true); }
    else if (m.type === 'text' && m.id === state.selected) showText(m);
    else if (m.type === 'error') $('err').textContent = m.message;
  });

  // ---- icons (16x16, stroked) ---------------------------------------------------

  const ICONS = {
    chevron: '<path d="M6 4.5v7l4.5-3.5z"/>',
    system_prompt: '<rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M5 6.5l2 1.5-2 1.5M8.5 10.5H11"/>',
    tools: '<path d="M10.5 2.5a3 3 0 0 0-2.8 4L2.8 11.4a1.2 1.2 0 0 0 1.8 1.8l4.9-4.9a3 3 0 0 0 4-2.8l-1.8 1-1.4-.4-.4-1.4z"/>',
    rules: '<path d="M3.5 2.5h7l2 2v9h-9z"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3"/>',
    skills: '<path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12 6.6 8.4 3 7l3.6-1.4z"/><path d="M12.5 11.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/>',
    mcp: '<rect x="2.5" y="2.5" width="11" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="11" height="4.5" rx="1.2"/><path d="M5 4.75h.01M5 11.25h.01"/>',
    subagents: '<circle cx="6" cy="5.5" r="2.2"/><path d="M2 13c.4-2.2 2-3.5 4-3.5s3.6 1.3 4 3.5"/><circle cx="11.2" cy="6.2" r="1.7"/><path d="M11.5 9.6c1.4.2 2.3 1.3 2.5 2.9"/>',
    summarized_conversation: '<path d="M3 4h10M3 7h7M3 10h10M3 13h5"/>',
    conversation: '<path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/>',
    user: '<path d="M13 3.5H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6l3 2.5v-2.5h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1z"/>',
    turn: '<path d="M2.5 3h7a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H6L4 10.5V9H2.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M12.5 6.5h1a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H13v1.5L11 12H8a1 1 0 0 1-1-1"/>',
    result: '<path d="M13 3v5a2 2 0 0 1-2 2H4"/><path d="M6.5 7.5L4 10l2.5 2.5"/>',
    reasoning: '<path d="M6 13h4M6.5 11h3c0-1.5 2.5-2.5 2.5-5a4 4 0 0 0-8 0c0 2.5 2.5 3.5 2.5 5z"/>',
    sent_context: '<path d="M2.5 8L13.5 3l-3 10.5-2.5-4.5z"/><path d="M8 9l5.5-6"/>',
    raw: '<path d="M6 3c-1.5 0-2 .7-2 2v1.5c0 .8-.5 1.5-1.5 1.5 1 0 1.5.7 1.5 1.5V11c0 1.3.5 2 2 2M10 3c1.5 0 2 .7 2 2v1.5c0 .8.5 1.5 1.5 1.5-1 0-1.5.7-1.5 1.5V11c0 1.3-.5 2-2 2"/>',
    chats: '<path d="M9 3h4v4M13 3L7.5 8.5"/><path d="M11 9.5V13H3V5h3.5"/>',
    folder: '<path d="M2 4.5a1 1 0 0 1 1-1h3.2l1.3 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>',
    folderOpen: '<path d="M2 12V4.5a1 1 0 0 1 1-1h3.2l1.3 1.5H12a1 1 0 0 1 1 1V7"/><path d="M2 12l1.6-4.2a1 1 0 0 1 .9-.6H14l-1.7 5.2H2z"/>',
    file: '<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/>',
  };
  const icon = (name) => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name] || ICONS.file}</svg>`;
  const chevron = (open) => `<span class="box chev${open ? ' open' : ''}" data-toggle="1"><svg viewBox="0 0 16 16" aria-hidden="true">${ICONS.chevron}</svg></span>`;
  const blank = '<span class="box"></span>';

  // ---- copy ---------------------------------------------------------------------

  const ABOUT = {
    system_prompt: 'Cursor’s own instructions to the agent: its role, tone, ground rules and how to use its tools. Sent at the start of every chat.',
    tools: 'The tools the agent can call. Cursor’s backend attaches their definitions, so only each tool’s name and size are stored on this machine.',
    rules: 'Standing instructions from your rules: always-applied rules in full, the others as a one-line description the agent can open when it needs them.',
    skills: 'The skills the agent may use, each by name and description. The agent reads a skill’s full SKILL.md only when it uses it.',
    mcp: 'Tools and instructions from MCP servers and other dynamic tool namespaces.',
    subagents: 'The helper agents and models this agent can hand work to.',
    summarized_conversation: 'The recap Cursor wrote when it summarized the earlier part of this chat to free up room.',
    conversation: 'The chat itself: your messages, the agent’s replies, and every tool call and result in between, grouped by turn.',
    raw: 'Every prompt message as Cursor stored it, in order: the exact input of the last model call.',
    chats: 'The subagents this chat started. Each one is a chat with its own context: click one to open its report.',
  };

  // ---- report ---------------------------------------------------------------------

  function renderChats(chats) {
    const sel = $('chat');
    const root = ctx.ancestors.length ? ctx.ancestors[0] : { composerId: ctx.composerId, name: ctx.name };
    if (!chats.some((c) => c.id === root.composerId)) chats = [{ id: root.composerId, name: root.name, used: root.composerId === ctx.composerId ? ctx.totalUsedTokens : undefined }, ...chats];
    sel.innerHTML = chats.map((c) => `<option value="${c.id}">${esc(c.name || 'Untitled chat')} — ${fmt(c.used)} tok${c.lastUpdatedAt ? ' · ' + new Date(c.lastUpdatedAt).toLocaleString() : ''}</option>`).join('');
    sel.value = root.composerId;
  }

  const sectionCategories = () => ctx.categories.filter((c) => c.estimatedTokens > 0 || c.items.length);
  const isOpen = (key, byDefault) => (state.open[key] === undefined ? byDefault : state.open[key]);

  function render() {
    $('app').classList.toggle('split', !!state.selected);
    const scroller = document.querySelector('.report'), top = scroller.scrollTop;
    const used = ctx.totalUsedTokens || 0, max = ctx.maxTokens || 0;
    const pct = max ? Math.round((used / max) * 100) : 0;
    const cats = sectionCategories();
    const counted = cats.filter((c) => c.id !== 'sent_context');
    const largest = [...counted].sort((a, b) => b.estimatedTokens - a.estimatedTokens)[0];
    const subagentTitle = ctx.parent ? `Subagent${ctx.parent.type ? ` · ${ctx.parent.type}` : ''}` : '';

    $('report').innerHTML =
      '<div class="head">' +
        crumbs() +
        '<div class="titles">' +
          `<span class="eyebrow">Context Usage Report${subagentTitle ? ` · ${esc(subagentTitle)}` : ''}</span>` +
          `<span class="big chat-title" title="${esc(ctx.name)}">${esc(ctx.name)}</span>` +
        '</div>' +
        '<div class="chunks">' +
          chunk('Model', ctx.model || '—') + chunk('Context size', max ? fmt(max) : '—') + chunk('Tokens used', `~${fmt(used)}`) + chunk('Messages', full(ctx.messageCount)) +
        '</div>' +
        '<p class="prose">The context window holds everything the agent reads on a turn: Cursor’s instructions, the tools it can use, your rules and skills, and the conversation so far. ' +
        'This report shows each part with the exact text the model received; click a row to read it.</p>' +
      '</div>' +
      donut(counted, used, max, pct) +
      (pct >= 80 && largest
        ? `<div class="callout"><b>The context window is getting full</b>${esc(largest.label)} is the largest part at ${full(largest.estimatedTokens)} tokens. Summarizing the conversation or starting a new chat frees the most room.</div>`
        : '') +
      '<div class="rule"></div>' +
      '<div class="explorer-head"><span class="big">Context Explorer</span>' +
        `<span class="actions"><button class="ghost" id="toggle-all">${allOpen() ? 'Collapse All' : 'Expand All'}</button>` +
        '<button id="debug" title="Open a new agent chat, with a prompt typed in for you to send, that asks how to reduce this chat’s context. It links this report and the chat’s history.">Debug with Agent</button></span></div>' +
      `<p class="prose">What the agent’s context held on its last turn, by category. ${ctx.hasTree ? 'Category sizes are Cursor’s counts; ' : ''}sizes of single items are estimates (4 characters per token).</p>` +
      '<div class="sections" id="sections">' +
        cats.map((c, i) => section(c.id, c.label, c.estimatedTokens, c.items, { first: i === 0, note: c.note })).join('') +
        chatsSection() +
        section('raw', 'All prompt messages (raw)', undefined, ctx.rawMessages, {}) +
      '</div>';
    scroller.scrollTop = top;
  }

  const chunk = (k, v) => `<div class="chunk"><span class="k">${esc(k)}</span><span class="v" title="${esc(v)}">${esc(v)}</span></div>`;

  // Breadcrumb: root chat › … › current subagent. Each ancestor opens its own report.
  function crumbs() {
    const chain = ctx.ancestors || [];
    if (!chain.length) return '';
    return '<div class="crumbs">' +
      chain.map((a) => `<a class="crumb" data-chat="${esc(a.composerId)}" title="Open this chat’s report">${esc(a.name)}</a><span class="crumb-sep">›</span>`).join('') +
      `<span>${esc(ctx.name)}</span></div>`;
  }

  // Colored arcs for the categories, a muted arc for the free rest of the window.
  function donut(cats, used, max, pct) {
    const size = 240, stroke = 32, r = (size - stroke) / 2, circ = 2 * Math.PI * r, c = size / 2;
    const slices = cats.filter((k) => k.estimatedTokens > 0).map((k) => ({ id: k.id, value: k.estimatedTokens }));
    const sum = slices.reduce((s, k) => s + k.value, 0);
    const total = max > 0 ? Math.max(max, sum) : sum || 1;
    if (total > sum) slices.push({ id: 'rest', value: total - sum });
    const gap = slices.length > 1 ? 2 : 0;
    let start = 0;
    const arcs = slices.map((k) => {
      const length = (k.value / total) * circ;
      const arc = `<circle class="arc ${k.id === 'rest' ? 'rest' : `c-${k.id}`}" data-cat="${k.id}" cx="${c}" cy="${c}" r="${r}" stroke-width="${stroke}" ` +
        `stroke-dasharray="${Math.max(0, length - gap)} ${circ}" stroke-dashoffset="${-start}"/>`;
      start += length;
      return arc;
    }).join('');
    return `<div class="donut" id="donut" data-pct="${pct}%"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct}% of the context window used">` +
      `<g transform="rotate(-90 ${c} ${c})">${arcs}</g></svg>` +
      `<div class="center"><span class="big pct" id="donut-pct">${pct}%</span><span class="cap" id="donut-cap">Full</span></div></div>`;
  }

  function hover(catId) {
    const d = $('donut');
    if (!d) return;
    const cat = catId && ctx.categories.find((c) => c.id === catId && c.estimatedTokens > 0);
    d.classList.toggle('hovering', !!cat);
    d.querySelectorAll('.arc').forEach((a) => a.classList.toggle('hot', !!cat && a.dataset.cat === catId));
    document.querySelectorAll('.sec-head').forEach((h) => h.classList.toggle('hot', !!cat && h.dataset.sec === catId));
    const total = Math.max(ctx.maxTokens || 0, ctx.totalUsedTokens || 0) || 1;
    $('donut-pct').textContent = cat ? `${Math.round((cat.estimatedTokens / total) * 100)}%` : d.dataset.pct;
    $('donut-cap').textContent = cat ? cat.label : 'Full';
  }

  const sectionKeys = () => [...sectionCategories().map((c) => c.id), ...(ctx.subagents && ctx.subagents.length ? ['chats'] : []), 'raw'];
  const allOpen = () => sectionKeys().every((id) => isOpen(`category:${id}`, false));

  function section(id, label, tokens, items, { first, note }) {
    const key = `category:${id}`;
    const open = isOpen(key, false);
    const count = leafCount(items);
    const trailing = tokens === undefined ? '' : `~${full(tokens)}${first ? ' tokens' : ''}`;
    return `<div class="c-${id}">` +
      `<div class="sec-head${open ? ' open' : ''}${state.selected === key ? ' selected' : ''}" data-sec="${id}" data-key="${key}">` +
        chevron(open) + `<span class="box ico">${icon(id)}</span>` +
        `<span class="label"><span class="name">${esc(label)}</span>${count ? `<span class="count">${count}</span>` : ''}</span>` +
        (items.length ? `<button class="ghost show-text" data-show="${key}" title="Show the text of the whole category">Text</button>` : '') +
        `<span class="tok">${trailing}</span>` +
      '</div>' +
      (open
        ? '<div class="sec-body">' +
          `<div class="sec-desc">${esc(ABOUT[id] || '')}${note ? `<span class="note">${esc(note)}</span>` : ''}</div>` +
          (id === 'conversation' ? conversation(items) : `<div class="kids">${unwrap(items).map((i) => item(i, 0, id)).join('')}</div>`) +
          '</div>'
        : '') +
      '</div>';
  }

  // A category holding one block (e.g. <rules>) lists that block's sections; its own text is
  // still the category's Text.
  const unwrap = (items) => (items.length === 1 && items[0].children && items[0].children.length ? items[0].children : items);

  const leafCount = (items) => items.reduce((n, i) => n + (i.children && i.children.length ? leafCount(i.children) : 1), 0);

  // A turn starts at each message holding a user query; what comes before is the preamble.
  function conversation(items) {
    const isQuery = (i) => i.kind === 'user_query' || (i.kind === 'user' && /^User: /.test(i.label));
    if (!items.some(isQuery)) return `<div class="kids">${items.map((i) => item(i, 0, 'conversation')).join('')}</div>`;
    const turns = [{ title: 'Before the first message', items: [] }];
    for (const i of items) {
      if (isQuery(i)) turns.push({ title: `Turn ${turns.length}`, snippet: i.label.replace(/^User: /, ''), items: [] });
      turns[turns.length - 1].items.push(i);
    }
    return '<div class="kids">' + turns.filter((t) => t.items.length).map((t, n, all) => {
      const key = `turn:${t.title}`;
      const open = isOpen(key, n === all.length - 1);
      const tokens = t.items.reduce((s, i) => s + (i.estimatedTokens || 0), 0);
      return `<div class="trow d0${open ? ' open' : ''}" data-turn="${esc(key)}" data-open="${open ? 1 : 0}">` + chevron(open) + `<span class="box ico">${icon('turn')}</span>` +
        `<span class="label"><span class="name">${esc(t.title)}</span><span class="count">${t.items.length}</span>${t.snippet ? `<span class="snippet">${esc(t.snippet)}</span>` : ''}</span>` +
        `<span class="tok">~${full(tokens)}</span></div>` +
        (open ? `<div class="kids guide g0">${t.items.map((i) => item(i, 1, 'conversation')).join('')}</div>` : '');
    }).join('') + '</div>';
  }

  // Readable names: a file path shows its file (a skill its folder), a bare tag its words.
  function display(label) {
    const tag = /^<([\w:.-]+)>( \(part\))?$/.exec(label);
    if (tag) {
      const words = tag[1].replace(/[_-]+/g, ' ');
      return words.charAt(0).toUpperCase() + words.slice(1) + (tag[2] || '');
    }
    if (/^\S*\/\S+$/.test(label)) {
      const parts = label.split('/').filter(Boolean);
      const base = parts[parts.length - 1];
      return base === 'SKILL.md' && parts.length > 1 ? parts[parts.length - 2] : base.replace(/\.mdc$/, '');
    }
    return label;
  }

  function leafIcon(i, cat) {
    if (cat !== 'conversation') return cat;
    const l = i.label;
    if (i.kind === 'user' || i.kind === 'user_query') return 'user';
    if (/reasoning/i.test(l)) return 'reasoning';
    if (/result$/.test(l) || i.kind === 'tool_result') return 'result';
    if (/args$|call/i.test(l) || i.kind === 'tool_call' || i.kind === 'tool_call_pair') return 'tools';
    return 'conversation';
  }

  function item(i, depth, cat) {
    const kids = i.children && i.children.length;
    const open = kids && !!state.open[i.id];
    const subs = i.subagents || [];
    const subsKey = `subs:${i.id}`;
    const d = Math.min(depth, 8);
    const lead = kids ? icon(open ? 'folderOpen' : 'folder') : icon(leafIcon(i, cat));
    return `<div class="trow d${d}${open ? ' open' : ''}${state.selected === i.id ? ' selected' : ''}${i.unavailable ? ' dim' : ''}" data-id="${esc(i.id)}">` +
      (kids ? chevron(open) : blank) + `<span class="box ico">${lead}</span>` +
      `<span class="label"><span class="name" title="${esc(i.label)}">${esc(display(i.label))}</span>${kids ? `<span class="count">${leafCount(i.children)}</span>` : ''}</span>` +
      subBadge(subs, subsKey) +
      (i.untracked ? '<span class="badge untracked" title="Not in Cursor’s usage breakdown: the model received this text, but Cursor did not attribute it to a category. Token count is an estimate.">not counted</span>' : '') +
      `<span class="tok">${i.estimatedTokens === undefined ? '' : `~${full(i.estimatedTokens)}`}</span></div>` +
      (subs.length > 1 && state.open[subsKey] ? `<div class="kids guide g${d}">${subs.map((s) => chatRow(ctx.subagents.find((x) => x.composerId === s.composerId) || s, depth + 1)).join('')}</div>` : '') +
      (open ? `<div class="kids guide g${d}">${i.children.map((c) => item(c, depth + 1, cat)).join('')}</div>` : '');
  }

  function subBadge(subs, key) {
    if (subs.length === 1) return `<span class="badge sub" data-chat="${esc(subs[0].composerId)}" title="Open subagent: ${esc(subs[0].name || '')}">↗ ${esc(shorten(subs[0].name || 'subagent', 18))}</span>`;
    if (subs.length > 1) return `<span class="badge sub" data-toggle-only="${esc(key)}" title="Spawned ${subs.length} subagents — click to list them">↗ ${subs.length} subagents</span>`;
    return '';
  }

  function chatsSection() {
    const subs = ctx.subagents || [];
    if (!subs.length) return '';
    const key = 'category:chats';
    const open = isOpen(key, false);
    const used = subs.reduce((s, x) => s + (x.used || 0), 0);
    return '<div class="c-chats">' +
      `<div class="sec-head${open ? ' open' : ''}" data-sec="chats" data-key="${key}">` + chevron(open) + `<span class="box ico">${icon('subagents')}</span>` +
      `<span class="label"><span class="name">Subagent chats</span><span class="count">${subs.length}</span></span><span class="tok">${used ? `~${full(used)}` : ''}</span></div>` +
      (open ? `<div class="sec-body"><div class="sec-desc">${esc(ABOUT.chats)}</div><div class="kids">${subs.map((s) => chatRow(s, 0)).join('')}</div></div>` : '') +
      '</div>';
  }

  function chatRow(s, depth) {
    const pct = s.max ? ` · ${Math.round((s.used / s.max) * 100)}%` : '';
    return `<div class="trow d${Math.min(depth, 8)}${s.hasContext ? '' : ' dim'}" data-chat="${esc(s.composerId)}" title="${s.hasContext ? 'Open this subagent’s report' : 'No context saved for this subagent'}">` +
      blank + `<span class="box ico">${icon('chats')}</span>` +
      `<span class="label"><span class="name">${esc(s.name || 'Untitled subagent')}</span>` +
      (s.type ? `<span class="badge type">${esc(s.type)}</span>` : '') +
      (s.nested ? `<span class="badge type" title="Has its own subagents">+${s.nested}</span>` : '') + '</span>' +
      `<span class="tok">${s.used ? `~${full(s.used)}${pct}` : ''}</span></div>`;
  }

  const shorten = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  function openChat(chatId) {
    state.selected = undefined; state.open = {}; state.folds = {}; save();
    vscode.postMessage({ type: 'openChat', chatId });
  }

  $('report').addEventListener('click', (e) => {
    if (e.target.closest('#toggle-all')) {
      const next = !allOpen();
      for (const id of sectionKeys()) state.open[`category:${id}`] = next;
      save(); render(); return;
    }
    if (e.target.closest('#debug')) { vscode.postMessage({ type: 'debugWithAgent' }); return; }
    // A slice of the donut opens its category and scrolls to it.
    const arc = e.target.closest('.arc:not(.rest)');
    if (arc) {
      state.open[`category:${arc.dataset.cat}`] = true;
      save(); render();
      const head = document.querySelector(`.sec-head[data-sec="${arc.dataset.cat}"]`);
      if (head) head.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    const show = e.target.closest('[data-show]');
    if (show) { select(show.dataset.show); return; }
    const chat = e.target.closest('[data-chat]');
    if (chat) { if (!chat.classList.contains('dim')) openChat(chat.dataset.chat); return; }
    const only = e.target.closest('[data-toggle-only]');
    if (only) { state.open[only.dataset.toggleOnly] = !state.open[only.dataset.toggleOnly]; save(); render(); return; }
    const head = e.target.closest('.sec-head');
    if (head) {
      const k = head.dataset.key;
      state.open[k] = !isOpen(k, false);
      save(); render(); return;
    }
    const turn = e.target.closest('[data-turn]');
    if (turn) { state.open[turn.dataset.turn] = turn.dataset.open !== '1'; save(); render(); return; }
    const r = e.target.closest('.trow[data-id]'); if (!r) return;
    const id = r.dataset.id;
    // The chevron folds; a click on the selected row folds too; a first click selects (and opens a folder).
    if (e.target.closest('[data-toggle]')) { state.open[id] = !state.open[id]; save(); render(); return; }
    if (state.selected === id) state.open[id] = !state.open[id];
    else if (r.querySelector('[data-toggle]')) state.open[id] = true;
    select(id);
  });

  $('report').addEventListener('mouseover', (e) => {
    const t = e.target.closest('.arc:not(.rest), .sec-head');
    hover(t ? t.dataset.cat || t.dataset.sec : undefined);
  });
  $('report').addEventListener('mouseleave', () => hover());

  function select(id, quiet) {
    state.selected = id; save(); render();
    if (!quiet) $('vt').textContent = 'Loading…';
    vscode.postMessage({ type: 'text', id });
  }

  $('close').addEventListener('click', () => { state.selected = undefined; save(); render(); });

  // ---- right: viewer ------------------------------------------------------------

  const MAX_HIGHLIGHT = 5000000, MAX_SHOWN = 5000000;
  let lines = []; // [{ depth, tokens: [[cls, text]], fold?: index of the line holding the matching close tag }]
  let folded = new Set(), hidden = new Uint8Array(0);

  function showText(m) {
    currentText = m.text;
    currentKind = m.kind || '';
    $('vt').textContent = m.label;
    $('vm').textContent = `${m.estimatedTokens !== undefined ? '~' + fmt(m.estimatedTokens) + ' tokens · ' : ''}${m.text.length.toLocaleString()} chars`;
    $('copy').disabled = $('open').disabled = false;
    paint();
  }

  function paint() {
    $('indent').classList.toggle('on', state.indent !== false);
    let text = currentText;
    const truncated = text.length > MAX_SHOWN;
    if (truncated) text = text.slice(0, MAX_SHOWN);
    lines = text.length > MAX_HIGHLIGHT ? text.split('\n').map((t) => ({ depth: 0, tokens: [['', t]] })) : tokenize(text, currentKind);
    if (truncated) lines.push({ depth: 0, tokens: [['t-label', '… truncated here — use "Open in editor" for the full text']] });
    const saved = new Set(state.folds[state.selected] || []);
    folded = new Set(foldKeys().filter(([, key]) => saved.has(key)).map(([i]) => i));
    computeHidden();
    const view = $('view');
    view.innerHTML = `<div class="code${state.indent !== false ? ' indent' : ''}">${lines.map((l, i) => lineHtml(l, i)).join('')}</div>`;
    view.scrollTop = 0;
    highlight();
  }

  function lineHtml(line, i, ranges) {
    const d = Math.min(line.depth, 8);
    const parts = []; // html per token, so the leading tag can be wrapped as the fold handle
    if (!ranges) for (const [c, t] of line.tokens) parts.push(c ? `<span class="${c}">${esc(t)}</span>` : esc(t));
    else {
      // Split tokens at match boundaries so a match may span several colored tokens.
      let pos = 0;
      for (const [c, t] of line.tokens) {
        let k = 0, body = '';
        while (k < t.length) {
          const at = pos + k;
          const r = ranges.find(([s, e]) => at >= s && at < e);
          const next = r ? Math.min(r[1], pos + t.length) : Math.min(pos + t.length, ...ranges.map(([s]) => s).filter((s) => s > at));
          const piece = esc(t.slice(k, next - pos));
          const span = c ? `<span class="${c}">${piece}</span>` : piece;
          body += r ? `<mark data-r="${r[0]}">${span}</mark>` : span;
          k = next - pos;
        }
        parts.push(body);
        pos += t.length;
      }
    }
    let cls = `ln d${d}`;
    if (line.fold) {
      const a = line.tokens.findIndex(([c, t]) => c === 't-punct' && t === '<');
      const b = line.tokens.findIndex(([c, t], k) => k > a && c === 't-punct' && t.endsWith('>'));
      parts[a] = `<span class="fold-tag" title="Click to fold or unfold this tag"><span class="fold-chev"></span>${parts[a]}`;
      parts[b] += '</span>';
      parts.push(`<span class="fold-ph" title="Click to unfold">⋯ ${(line.fold - i - 1).toLocaleString()} lines</span>`);
      if (folded.has(i)) cls += ' folded';
    }
    if (hidden[i]) cls += ' hid';
    return `<div class="${cls}" data-i="${i}">${parts.join('') || '​'}</div>`;
  }

  // ---- tokenizer: exact text, tagged with classes -----------------------------

  const TAG_RE = /<\/?[A-Za-z][\w:.-]*(?:\s+[\w:.-]+(?:="[^"]*")?)*\s*\/?>/g;
  const LABEL_RE = /^\[(reasoning|tool call: [^\]]+|tool result: [^\]]+|image)\]$/;

  function tokenize(text, kind) {
    const raw = text.split('\n');
    const trimmed = text.trim();
    let wholeJson = kind === 'tool_call' || kind === 'tool_result';
    if (!wholeJson && /^[\[{]/.test(trimmed)) { try { JSON.parse(trimmed); wholeJson = true; } catch {} }
    if (wholeJson) return raw.map((l) => ({ depth: 0, tokens: jsonTokens(l) }));

    const opens = structuralOpens(text);
    const lineStarts = [0];
    for (let k = text.indexOf('\n'); k !== -1; k = text.indexOf('\n', k + 1)) lineStarts.push(k + 1);
    const lineOf = (pos) => { let lo = 0, hi = lineStarts.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (lineStarts[mid] <= pos) lo = mid; else hi = mid - 1; } return lo; };
    const closeAt = new Map(opens.map((o) => [o.start, lineOf(o.close)]));
    const out = [];
    let depth = 0, offset = 0, mode = 'text', fence = '';
    for (const line of raw) {
      const t = line.trim();
      let d = depth, tokens, fold;
      if (mode === 'fence') {
        if (t.startsWith(fence)) { mode = 'text'; tokens = [['t-fence', line]]; }
        else tokens = fenceLang === 'json' ? jsonTokens(line) : [['t-code', line]];
      } else if (mode === 'payload' && !LABEL_RE.test(t)) {
        tokens = jsonTokens(line);
      } else {
        if (mode === 'payload') mode = 'text';
        const f = t.match(/^(```+|~~~+)\s*([\w+-]*)/);
        if (f) { mode = 'fence'; fence = f[1]; fenceLang = f[2].toLowerCase(); tokens = [['t-fence', line]]; }
        else if (LABEL_RE.test(t)) { tokens = [['t-label', line]]; if (/^\[tool (call|result)/.test(t)) mode = 'payload'; }
        else if (/^===== .* =====$/.test(t)) { tokens = [['t-divider', line]]; d = 0; }
        else {
          // Indent: a line starting with a matched close tag sits at the outer depth.
          if (/^<\//.test(t)) d = Math.max(0, depth - countLeadingCloses(t));
          tokens = mdTokens(line);
          // Foldable: the line opens a tag whose close is at least two lines down.
          const close = closeAt.get(offset);
          if (close - out.length >= 2 && tokens.some(([c, s]) => c === 't-punct' && s === '<')) fold = close;
        }
      }
      out.push(fold ? { depth: d, tokens, fold } : { depth: d, tokens });
      // Depth after this line: matched opens on it minus closes on it.
      if (mode === 'text' || tokens[0][0] === 't-fence') {
        const lineEnd = offset + line.length;
        let delta = 0;
        for (const o of opens) {
          if (o.start >= offset && o.start < lineEnd) delta++;
          if (o.close >= offset && o.close < lineEnd) delta--;
        }
        depth = Math.max(0, depth + delta);
      }
      offset += line.length + 1;
    }
    return out;
  }
  let fenceLang = '';

  function countLeadingCloses(t) {
    const m = t.match(/^(?:<\/[\w:.-]+>\s*)+/);
    return m ? (m[0].match(/<\//g) || []).length : 0;
  }

  // Open tags (at line start) that have a matching close: these drive indentation.
  function structuralOpens(text) {
    const res = [];
    const re = /^[ \t]*<([A-Za-z][\w:.-]*)(?:\s[^>]*)?>/gm;
    let m;
    while ((m = re.exec(text))) {
      if (m[0].endsWith('/>')) continue;
      const close = findClose(text, m[1], re.lastIndex);
      if (close !== -1 && text.slice(re.lastIndex, close).includes('\n')) res.push({ start: m.index, close });
    }
    return res;
  }

  function findClose(text, name, from) {
    const open = new RegExp(`<${name.replace(/[.]/g, '\\.')}(?:\\s[^>]*)?>`, 'g'), closeTag = `</${name}>`;
    let depth = 1, i = from;
    for (let guard = 0; guard < 10000; guard++) {
      const c = text.indexOf(closeTag, i);
      if (c === -1) return -1;
      open.lastIndex = i;
      let o;
      while ((o = open.exec(text)) && o.index < c) depth++;
      if (--depth === 0) return c;
      i = c + closeTag.length;
    }
    return -1;
  }

  // Markdown + inline XML tags on one line; returns tokens whose texts concatenate to the line.
  function mdTokens(line) {
    const toks = [];
    let rest = line;
    const lead = rest.match(/^(\s*)(#{1,6}\s.*)$/);
    if (lead) return pushInline(lead[1] ? [['', lead[1]]] : [], lead[2], 't-h');
    const quote = rest.match(/^(\s*>+\s?)(.*)$/);
    if (quote && !/^\s*>\s*$/.test(rest) && !/^\s*<|^\s*>[^ ]/.test(rest)) return pushInline([['t-quote', quote[1]]], quote[2], 't-quote');
    const bullet = rest.match(/^(\s*)([-*+]|\d+[.)])(\s+)/);
    if (bullet) { toks.push(['', bullet[1]], ['t-bullet', bullet[2]], ['', bullet[3]]); rest = rest.slice(bullet[0].length); }
    if (/^\s*\|.*\|\s*$/.test(line)) return inlineTokens(rest, toks, '', /\|/g);
    return inlineTokens(rest, toks, '');
  }

  function pushInline(toks, text, base) { return inlineTokens(text, toks, base); }

  const INLINE_RE = /(`[^`]+`)|(<\/?[A-Za-z][\w:.-]*(?:\s+[\w:.-]+(?:="[^"]*")?)*\s*\/?>)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)\s]+\))|(https?:\/\/[^\s)>"]+)/g;

  function inlineTokens(text, toks, base, pipeRe) {
    let pos = 0, m;
    INLINE_RE.lastIndex = 0;
    const plain = (s) => {
      if (!s) return;
      if (pipeRe) s.split(/(\|)/).forEach((p) => p && toks.push([p === '|' ? 't-table' : base, p]));
      else toks.push([base, s]);
    };
    while ((m = INLINE_RE.exec(text))) {
      plain(text.slice(pos, m.index));
      if (m[1]) toks.push(['t-code', m[1]]);
      else if (m[2]) tagTokens(m[2], toks);
      else if (m[3]) toks.push(['t-strong', m[3]]);
      else toks.push(['t-link', m[0]]);
      pos = INLINE_RE.lastIndex;
    }
    plain(text.slice(pos));
    return toks.length ? toks : [['', '']];
  }

  function tagTokens(tag, toks) {
    const m = tag.match(/^(<\/?)([A-Za-z][\w:.-]*)([\s\S]*?)(\/?>)$/);
    toks.push(['t-punct', m[1]], ['t-tag', m[2]]);
    const rest = m[3];
    const ATTR = /(\s+)([\w:.-]+)(?:(=)("[^"]*"))?/y;
    let a, end = 0; // a failed sticky exec resets lastIndex, so track the end ourselves
    while ((a = ATTR.exec(rest))) {
      toks.push(['', a[1]], ['t-attr', a[2]]);
      if (a[3]) toks.push(['t-punct', a[3]], ['t-val', a[4]]);
      end = ATTR.lastIndex;
    }
    if (end < rest.length) toks.push(['', rest.slice(end)]);
    toks.push(['t-punct', m[4]]);
  }

  const JSON_RE = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|([{}\[\],])/g;

  function jsonTokens(line) {
    const toks = [];
    let pos = 0, m;
    JSON_RE.lastIndex = 0;
    while ((m = JSON_RE.exec(line))) {
      if (m.index > pos) toks.push(['', line.slice(pos, m.index)]);
      if (m[1]) { toks.push([m[2] ? 't-key' : 't-str', m[1]]); if (m[2]) toks.push(['t-punct', m[2]]); }
      else if (m[3]) toks.push(['t-lit', m[0]]);
      else if (m[4]) toks.push(['t-punct', m[0]]);
      else toks.push(['t-num', m[0]]);
      pos = JSON_RE.lastIndex;
    }
    if (pos < line.length) toks.push(['', line.slice(pos)]);
    return toks.length ? toks : [['', '']];
  }

  // ---- find (matches may cross colored tokens) ---------------------------------

  let matchLines = [];

  function highlight(step) {
    const view = $('view');
    if (!step) {
      for (const i of matchLines) {
        const el = view.querySelector(`.ln[data-i="${i}"]`);
        if (el) el.outerHTML = lineHtml(lines[i], i);
      }
      matchLines = [];
      findIndex = 0;
      const q = $('find').value.toLowerCase();
      if (q) {
        lines.forEach((l, i) => {
          const text = l.tokens.map((t) => t[1]).join('').toLowerCase();
          const ranges = [];
          for (let k = text.indexOf(q); k !== -1; k = text.indexOf(q, k + q.length)) ranges.push([k, k + q.length]);
          if (!ranges.length) return;
          const el = view.querySelector(`.ln[data-i="${i}"]`);
          if (el) el.outerHTML = lineHtml(l, i, ranges);
          matchLines.push(i);
        });
      }
    }
    const marks = [...view.querySelectorAll('mark')].filter((m, k, all) => !(k > 0 && all[k - 1].parentElement === m.parentElement && all[k - 1].dataset.r === m.dataset.r));
    $('vm').dataset.count = marks.length;
    if (!marks.length) return;
    view.querySelectorAll('mark.current').forEach((m) => m.classList.remove('current'));
    if (step) findIndex = (findIndex + step + marks.length) % marks.length;
    const cur = marks[findIndex];
    const at = +cur.closest('.ln').dataset.i;
    if (hidden[at]) { for (const f of [...folded]) if (f < at && at < lines[f].fold) folded.delete(f); applyFolds(); }
    cur.parentElement.querySelectorAll(`mark[data-r="${cur.dataset.r}"]`).forEach((m) => m.classList.add('current'));
    cur.scrollIntoView({ block: 'center' });
  }

  // ---- folding ------------------------------------------------------------------

  function computeHidden() {
    hidden = new Uint8Array(lines.length);
    for (const f of folded) hidden.fill(1, f + 1, lines[f].fold);
  }

  // Folds are saved by their tag line's text (and which repeat of it), not by line number:
  // the item's text shifts as the chat grows, and following may switch to another chat.
  function foldKeys() {
    const seen = new Map(), keys = [];
    lines.forEach((l, i) => {
      if (!l.fold) return;
      const text = l.tokens.map((t) => t[1]).join('');
      const n = (seen.get(text) || 0) + 1;
      seen.set(text, n);
      keys.push([i, `${n}:${text}`]);
    });
    return keys;
  }

  function applyFolds() {
    computeHidden();
    state.folds[state.selected] = foldKeys().filter(([i]) => folded.has(i)).map(([, key]) => key); save();
    for (const el of $('view').querySelectorAll('.ln')) {
      const i = +el.dataset.i;
      el.classList.toggle('hid', !!hidden[i]);
      if (lines[i].fold) el.classList.toggle('folded', folded.has(i));
    }
  }

  $('view').addEventListener('click', (e) => {
    const handle = e.target.closest('.fold-tag, .fold-ph');
    if (!handle || !window.getSelection().isCollapsed) return;
    const i = +handle.closest('.ln').dataset.i;
    if (folded.has(i)) folded.delete(i); else folded.add(i);
    applyFolds();
  });

  $('find').addEventListener('input', () => highlight());
  $('find').addEventListener('keydown', (e) => { if (e.key === 'Enter') highlight(e.shiftKey ? -1 : 1); });
  $('indent').addEventListener('click', () => { state.indent = state.indent === false; save(); paint(); });
  $('copy').addEventListener('click', () => vscode.postMessage({ type: 'copy', id: state.selected }));
  $('open').addEventListener('click', () => vscode.postMessage({ type: 'openEditor', id: state.selected }));
  $('refresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  $('follow').addEventListener('change', (e) => vscode.postMessage({ type: 'follow', value: e.target.checked }));
  $('chat').addEventListener('change', (e) => { state.selected = undefined; state.open = {}; state.folds = {}; save(); $('follow').checked = false; vscode.postMessage({ type: 'selectChat', chatId: e.target.value }); });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
