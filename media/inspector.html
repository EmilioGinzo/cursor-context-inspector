<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}} 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style nonce="{{nonce}}">
  /* The CSP blocks inline style="" attributes, so colors are classes and widths are set from script. */
  .c-system_prompt { --cat: #a3a3a3; } .c-tools { --cat: #a99cf5; } .c-rules { --cat: #a3d97a; } .c-skills { --cat: #f5d76e; }
  .c-mcp { --cat: #8f7cf0; } .c-subagents { --cat: #f5a56e; } .c-summarized_conversation { --cat: #6ec9f5; } .c-conversation { --cat: #f0806a; } .c-raw { --cat: #777; }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: 13px; color: var(--vscode-foreground); background: var(--vscode-editor-background); }
  .layout { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; height: 100vh; }
  .left { border-right: 1px solid var(--vscode-panel-border); overflow: auto; padding: 12px; }
  .right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  select { flex: 1; min-width: 0; background: var(--vscode-dropdown-background); color: var(--vscode-dropdown-foreground); border: 1px solid var(--vscode-dropdown-border); padding: 3px; }
  button { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: none; padding: 4px 9px; border-radius: 3px; cursor: pointer; }
  button:hover { background: var(--vscode-button-secondaryHoverBackground); }
  button.on { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  label.follow { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--vscode-descriptionForeground); }

  .card { background: var(--vscode-editorWidget-background); border: 1px solid var(--vscode-editorWidget-border, var(--vscode-panel-border)); border-radius: 8px; padding: 12px; }
  .title { font-weight: 600; margin-bottom: 8px; }
  .summary { display: flex; justify-content: space-between; color: var(--vscode-descriptionForeground); margin-bottom: 6px; }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--vscode-input-background); margin-bottom: 10px; }
  .bar > div { height: 100%; background: var(--cat); }
  .bar > div + div { margin-left: 1px; }
  .meta { color: var(--vscode-descriptionForeground); font-size: 11px; margin-bottom: 8px; }

  .row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; user-select: none; }
  .row:hover { background: var(--vscode-list-hoverBackground); }
  .row.selected { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
  .row .chev { width: 10px; flex: none; color: var(--vscode-descriptionForeground); font-size: 10px; }
  .row .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; background: var(--cat); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tok { color: var(--vscode-descriptionForeground); font-variant-numeric: tabular-nums; }
  .row.dim .name { opacity: .6; }
  .children { margin-left: 11px; padding-left: 6px; border-left: 2px solid color-mix(in srgb, var(--cat) 45%, transparent); }
  .sep { border-top: 1px solid var(--vscode-panel-border); margin: 8px 0; }

  .viewer-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--vscode-panel-border); }
  .viewer-head .vt { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-head .vm { color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .seg { display: flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  input.find { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent); padding: 3px 6px; width: 150px; }
  #view { flex: 1; overflow: auto; min-height: 0; }
  mark { background: var(--vscode-editor-findMatchHighlightBackground, #f5d76e66); color: inherit; border-radius: 2px; }
  mark.current { outline: 1px solid var(--vscode-editor-findMatchBorder, #f5d76e); }
  .empty { color: var(--vscode-descriptionForeground); padding: 24px; }
  .error { color: var(--vscode-errorForeground); white-space: pre-wrap; }

  /* Text view: the exact characters, colored, with nested tag contents indented visually. */
  .code { padding: 12px 0 40px; font-family: var(--vscode-editor-font-family); font-size: var(--vscode-editor-font-size); line-height: 1.5; }
  .ln { white-space: pre-wrap; word-break: break-word; padding-right: 16px; min-height: 1.5em; }
  .ln:hover { background: var(--vscode-editor-lineHighlightBackground, #ffffff08); }
  .code .d0 { padding-left: 16px; }
  .code.indent .d1 { padding-left: 34px; } .code.indent .d2 { padding-left: 52px; } .code.indent .d3 { padding-left: 70px; }
  .code.indent .d4 { padding-left: 88px; } .code.indent .d5 { padding-left: 106px; } .code.indent .d6 { padding-left: 124px; }
  .code.indent .d7 { padding-left: 142px; } .code.indent .d8 { padding-left: 160px; }
  .code:not(.indent) .ln { padding-left: 16px; }
  .t-punct { color: #808080; }
  .t-tag { color: var(--vscode-debugTokenExpression-name, #569cd6); }
  .t-attr { color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe); }
  .t-val { color: var(--vscode-debugTokenExpression-string, #ce9178); }
  .t-h { color: #e5c07b; font-weight: 600; }
  .t-bullet { color: #c678dd; }
  .t-strong { font-weight: 600; color: #e6e6e6; }
  .t-em { font-style: italic; }
  .t-code { color: #98c379; }
  .t-fence { color: #7f848e; }
  .t-quote { color: #7f848e; font-style: italic; }
  .t-link { color: var(--vscode-textLink-foreground); }
  .t-label { color: #c678dd; font-weight: 600; }
  .t-divider { color: #e5c07b; font-weight: 600; }
  .t-key { color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe); } .t-str { color: var(--vscode-debugTokenExpression-string, #ce9178); }
  .t-num { color: var(--vscode-debugTokenExpression-number, #b5cea8); } .t-lit { color: var(--vscode-debugTokenExpression-boolean, #569cd6); }
  .t-table { color: #7f848e; }
</style>
</head>
<body>
<div class="layout">
  <div class="left">
    <div class="toolbar">
      <select id="chat" title="Chat"></select>
      <button id="refresh" title="Refresh">↻</button>
    </div>
    <div class="toolbar"><label class="follow"><input type="checkbox" id="follow"> Follow the focused chat</label></div>
    <div class="card">
      <div class="title">Context Usage</div>
      <div class="summary"><span id="pct"></span><span id="tot"></span></div>
      <div class="bar" id="bar"></div>
      <div class="meta" id="meta"></div>
      <div id="cats"></div>
    </div>
    <div id="err" class="error"></div>
  </div>
  <div class="right">
    <div class="viewer-head">
      <span class="vt" id="vt">Select a category or item</span>
      <span class="vm" id="vm"></span>
      <button id="indent" class="on" title="Indent the contents of nested tags (display only; copy keeps the original text)">Indent</button>
      <input class="find" id="find" placeholder="Find (Enter = next)">
      <button id="copy" disabled>Copy</button>
      <button id="open" disabled>Open in editor</button>
    </div>
    <div id="view"><div class="empty">Click any row on the left to see the exact text the agent received for it.</div></div>
  </div>
</div>
<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  const state = Object.assign({ open: {}, selected: undefined, indent: true }, vscode.getState() || {});
    let ctx, currentText = '', currentKind = '', findIndex = 0;

  const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n ?? 0));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const save = () => vscode.setState(state);

  window.addEventListener('message', ({ data: m }) => {
    if (m.type === 'context') { $('err').textContent = ''; ctx = m.context; renderChats(m.chats); $('follow').checked = m.follow; render(); if (state.selected) select(state.selected, true); }
    else if (m.type === 'text' && m.id === state.selected) showText(m);
    else if (m.type === 'error') $('err').textContent = m.message;
  });

  // ---- left: popover replica + tree ------------------------------------------

  function renderChats(chats) {
    const sel = $('chat');
    if (!chats.some((c) => c.id === ctx.composerId)) chats = [{ id: ctx.composerId, name: ctx.name, used: ctx.totalUsedTokens }, ...chats];
    sel.innerHTML = chats.map((c) => `<option value="${c.id}">${esc(c.name || 'Untitled chat')} — ${fmt(c.used)} tok${c.lastUpdatedAt ? ' · ' + new Date(c.lastUpdatedAt).toLocaleString() : ''}</option>`).join('');
    sel.value = ctx.composerId;
  }

  function render() {
    const pct = ctx.maxTokens ? Math.round((ctx.totalUsedTokens / ctx.maxTokens) * 100) : 0;
    $('pct').textContent = `${pct}% Full`;
    $('tot').textContent = `~${fmt(ctx.totalUsedTokens)} / ${fmt(ctx.maxTokens)} Tokens`;
    const bar = $('bar');
    bar.innerHTML = ctx.categories.filter((c) => c.estimatedTokens > 0).map((c) => `<div class="c-${c.id}" data-tokens="${c.estimatedTokens}" title="${esc(c.label)}: ${fmt(c.estimatedTokens)}"></div>`).join('');
    for (const seg of bar.children) seg.style.width = `${ctx.maxTokens ? (seg.dataset.tokens / ctx.maxTokens) * 100 : 0}%`;
    $('meta').textContent = `${ctx.model || ''} · ${ctx.hasTree ? 'item spans from Cursor’s usage tree' : 'items parsed from the stored prompt'}`;
    const cats = ctx.categories.filter((c) => c.estimatedTokens > 0 || c.items.length);
    $('cats').innerHTML = cats.map((c) => category(c.id, c.label, c.estimatedTokens, c.items)).join('') +
      '<div class="sep"></div>' + category('raw', 'All prompt messages (raw)', undefined, ctx.rawMessages);
  }

  function category(id, label, tokens, items) {
    const key = `category:${id}`;
    return `<div class="c-${id}">` + row(key, label, tokens, items.length > 0, true, false) +
      (state.open[key] ? `<div class="children">${items.map(item).join('')}</div>` : '') + '</div>';
  }

  function item(i) {
    const kids = i.children && i.children.length;
    return row(i.id, i.label, i.estimatedTokens, kids, false, i.unavailable) +
      (kids && state.open[i.id] ? `<div class="children">${i.children.map(item).join('')}</div>` : '');
  }

  function row(id, label, tokens, expandable, swatch, dim) {
    const chev = expandable ? (state.open[id] ? '▾' : '▸') : '';
    return `<div class="row${state.selected === id ? ' selected' : ''}${dim ? ' dim' : ''}" data-id="${esc(id)}">` +
      `<span class="chev" data-toggle="1">${chev}</span>` +
      (swatch ? '<span class="sw"></span>' : '') +
      `<span class="name" title="${esc(label)}">${esc(label)}</span>` +
      `<span class="tok">${tokens === undefined ? '' : fmt(tokens)}</span></div>`;
  }

  $('cats').addEventListener('click', (e) => {
    const r = e.target.closest('.row'); if (!r) return;
    const id = r.dataset.id;
    // Chevron or a second click toggles; first click on a category also expands it.
    if ((e.target.dataset.toggle && e.target.textContent) || state.selected === id) state.open[id] = !state.open[id];
    else if (id.startsWith('category:')) state.open[id] = true;
    select(id);
  });

  function select(id, quiet) {
    state.selected = id; save(); render();
    if (!quiet) $('vt').textContent = 'Loading…';
    vscode.postMessage({ type: 'text', id });
  }

  // ---- right: viewer ------------------------------------------------------------

  const MAX_HIGHLIGHT = 300000, MAX_SHOWN = 1500000;
  let lines = []; // [{ depth, tokens: [[cls, text]] }]

  function showText(m) {
    currentText = m.text;
    currentKind = m.kind || '';
    $('vt').textContent = m.label;
    $('vm').textContent = `${m.estimatedTokens !== undefined ? '~' + fmt(m.estimatedTokens) + ' tokens · ' : ''}${m.text.length.toLocaleString()} chars`;
    $('copy').disabled = $('open').disabled = false;
    paint();
  }

  function paint() {
    $('indent').classList.toggle('on', state.indent !== false);
    let text = currentText;
    const truncated = text.length > MAX_SHOWN;
    if (truncated) text = text.slice(0, MAX_SHOWN);
    lines = text.length > MAX_HIGHLIGHT ? text.split('\n').map((t) => ({ depth: 0, tokens: [['', t]] })) : tokenize(text, currentKind);
    if (truncated) lines.push({ depth: 0, tokens: [['t-label', '… truncated here — use "Open in editor" for the full text']] });
    const view = $('view');
    view.innerHTML = `<div class="code${state.indent !== false ? ' indent' : ''}">${lines.map((l, i) => lineHtml(l, i)).join('')}</div>`;
    view.scrollTop = 0;
    highlight();
  }

  function lineHtml(line, i, ranges) {
    const d = Math.min(line.depth, 8);
    let body = '';
    if (!ranges) body = line.tokens.map(([c, t]) => (c ? `<span class="${c}">${esc(t)}</span>` : esc(t))).join('');
    else {
      // Split tokens at match boundaries so a match may span several colored tokens.
      let pos = 0;
      for (const [c, t] of line.tokens) {
        let k = 0;
        while (k < t.length) {
          const at = pos + k;
          const r = ranges.find(([s, e]) => at >= s && at < e);
          const next = r ? Math.min(r[1], pos + t.length) : Math.min(pos + t.length, ...ranges.map(([s]) => s).filter((s) => s > at));
          const piece = esc(t.slice(k, next - pos));
          const span = c ? `<span class="${c}">${piece}</span>` : piece;
          body += r ? `<mark data-r="${r[0]}">${span}</mark>` : span;
          k = next - pos;
        }
        pos += t.length;
      }
    }
    return `<div class="ln d${d}" data-i="${i}">${body || '​'}</div>`;
  }

  // ---- tokenizer: exact text, tagged with classes -----------------------------

  const TAG_RE = /<\/?[A-Za-z][\w:.-]*(?:\s+[\w:.-]+(?:="[^"]*")?)*\s*\/?>/g;
  const LABEL_RE = /^\[(reasoning|tool call: [^\]]+|tool result: [^\]]+|image)\]$/;

  function tokenize(text, kind) {
    const raw = text.split('\n');
    const trimmed = text.trim();
    let wholeJson = kind === 'tool_call' || kind === 'tool_result';
    if (!wholeJson && /^[\[{]/.test(trimmed)) { try { JSON.parse(trimmed); wholeJson = true; } catch {} }
    if (wholeJson) return raw.map((l) => ({ depth: 0, tokens: jsonTokens(l) }));

    const opens = structuralOpens(text);
    const out = [];
    let depth = 0, offset = 0, mode = 'text', fence = '';
    for (const line of raw) {
      const t = line.trim();
      let d = depth, tokens;
      if (mode === 'fence') {
        if (t.startsWith(fence)) { mode = 'text'; tokens = [['t-fence', line]]; }
        else tokens = fenceLang === 'json' ? jsonTokens(line) : [['t-code', line]];
      } else if (mode === 'payload' && !LABEL_RE.test(t)) {
        tokens = jsonTokens(line);
      } else {
        if (mode === 'payload') mode = 'text';
        const f = t.match(/^(```+|~~~+)\s*([\w+-]*)/);
        if (f) { mode = 'fence'; fence = f[1]; fenceLang = f[2].toLowerCase(); tokens = [['t-fence', line]]; }
        else if (LABEL_RE.test(t)) { tokens = [['t-label', line]]; if (/^\[tool (call|result)/.test(t)) mode = 'payload'; }
        else if (/^===== .* =====$/.test(t)) { tokens = [['t-divider', line]]; d = 0; }
        else {
          // Indent: a line starting with a matched close tag sits at the outer depth.
          if (/^<\//.test(t)) d = Math.max(0, depth - countLeadingCloses(t));
          tokens = mdTokens(line);
        }
      }
      out.push({ depth: d, tokens });
      // Depth after this line: matched opens on it minus closes on it.
      if (mode === 'text' || tokens[0][0] === 't-fence') {
        const lineEnd = offset + line.length;
        let delta = 0;
        for (const o of opens) {
          if (o.start >= offset && o.start < lineEnd) delta++;
          if (o.close >= offset && o.close < lineEnd) delta--;
        }
        depth = Math.max(0, depth + delta);
      }
      offset += line.length + 1;
    }
    return out;
  }
  let fenceLang = '';

  function countLeadingCloses(t) {
    const m = t.match(/^(?:<\/[\w:.-]+>\s*)+/);
    return m ? (m[0].match(/<\//g) || []).length : 0;
  }

  // Open tags (at line start) that have a matching close: these drive indentation.
  function structuralOpens(text) {
    const res = [];
    const re = /^[ \t]*<([A-Za-z][\w:.-]*)(?:\s[^>]*)?>/gm;
    let m;
    while ((m = re.exec(text))) {
      if (m[0].endsWith('/>')) continue;
      const close = findClose(text, m[1], re.lastIndex);
      if (close !== -1 && text.slice(re.lastIndex, close).includes('\n')) res.push({ start: m.index, close });
    }
    return res;
  }

  function findClose(text, name, from) {
    const open = new RegExp(`<${name.replace(/[.]/g, '\\.')}(?:\\s[^>]*)?>`, 'g'), closeTag = `</${name}>`;
    let depth = 1, i = from;
    for (let guard = 0; guard < 10000; guard++) {
      const c = text.indexOf(closeTag, i);
      if (c === -1) return -1;
      open.lastIndex = i;
      let o;
      while ((o = open.exec(text)) && o.index < c) depth++;
      if (--depth === 0) return c;
      i = c + closeTag.length;
    }
    return -1;
  }

  // Markdown + inline XML tags on one line; returns tokens whose texts concatenate to the line.
  function mdTokens(line) {
    const toks = [];
    let rest = line;
    const lead = rest.match(/^(\s*)(#{1,6}\s.*)$/);
    if (lead) return pushInline(lead[1] ? [['', lead[1]]] : [], lead[2], 't-h');
    const quote = rest.match(/^(\s*>+\s?)(.*)$/);
    if (quote && !/^\s*>\s*$/.test(rest) && !/^\s*<|^\s*>[^ ]/.test(rest)) return pushInline([['t-quote', quote[1]]], quote[2], 't-quote');
    const bullet = rest.match(/^(\s*)([-*+]|\d+[.)])(\s+)/);
    if (bullet) { toks.push(['', bullet[1]], ['t-bullet', bullet[2]], ['', bullet[3]]); rest = rest.slice(bullet[0].length); }
    if (/^\s*\|.*\|\s*$/.test(line)) return inlineTokens(rest, toks, '', /\|/g);
    return inlineTokens(rest, toks, '');
  }

  function pushInline(toks, text, base) { return inlineTokens(text, toks, base); }

  const INLINE_RE = /(`[^`]+`)|(<\/?[A-Za-z][\w:.-]*(?:\s+[\w:.-]+(?:="[^"]*")?)*\s*\/?>)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)\s]+\))|(https?:\/\/[^\s)>"]+)/g;

  function inlineTokens(text, toks, base, pipeRe) {
    let pos = 0, m;
    INLINE_RE.lastIndex = 0;
    const plain = (s) => {
      if (!s) return;
      if (pipeRe) s.split(/(\|)/).forEach((p) => p && toks.push([p === '|' ? 't-table' : base, p]));
      else toks.push([base, s]);
    };
    while ((m = INLINE_RE.exec(text))) {
      plain(text.slice(pos, m.index));
      if (m[1]) toks.push(['t-code', m[1]]);
      else if (m[2]) tagTokens(m[2], toks);
      else if (m[3]) toks.push(['t-strong', m[3]]);
      else toks.push(['t-link', m[0]]);
      pos = INLINE_RE.lastIndex;
    }
    plain(text.slice(pos));
    return toks.length ? toks : [['', '']];
  }

  function tagTokens(tag, toks) {
    const m = tag.match(/^(<\/?)([A-Za-z][\w:.-]*)([\s\S]*?)(\/?>)$/);
    toks.push(['t-punct', m[1]], ['t-tag', m[2]]);
    const rest = m[3];
    const ATTR = /(\s+)([\w:.-]+)(?:(=)("[^"]*"))?/y;
    let a, end = 0; // a failed sticky exec resets lastIndex, so track the end ourselves
    while ((a = ATTR.exec(rest))) {
      toks.push(['', a[1]], ['t-attr', a[2]]);
      if (a[3]) toks.push(['t-punct', a[3]], ['t-val', a[4]]);
      end = ATTR.lastIndex;
    }
    if (end < rest.length) toks.push(['', rest.slice(end)]);
    toks.push(['t-punct', m[4]]);
  }

  const JSON_RE = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|([{}\[\],])/g;

  function jsonTokens(line) {
    const toks = [];
    let pos = 0, m;
    JSON_RE.lastIndex = 0;
    while ((m = JSON_RE.exec(line))) {
      if (m.index > pos) toks.push(['', line.slice(pos, m.index)]);
      if (m[1]) { toks.push([m[2] ? 't-key' : 't-str', m[1]]); if (m[2]) toks.push(['t-punct', m[2]]); }
      else if (m[3]) toks.push(['t-lit', m[0]]);
      else if (m[4]) toks.push(['t-punct', m[0]]);
      else toks.push(['t-num', m[0]]);
      pos = JSON_RE.lastIndex;
    }
    if (pos < line.length) toks.push(['', line.slice(pos)]);
    return toks.length ? toks : [['', '']];
  }

  // ---- find (matches may cross colored tokens) ---------------------------------

  let matchLines = [];

  function highlight(step) {
    const view = $('view');
    if (!step) {
      for (const i of matchLines) {
        const el = view.querySelector(`.ln[data-i="${i}"]`);
        if (el) el.outerHTML = lineHtml(lines[i], i);
      }
      matchLines = [];
      findIndex = 0;
      const q = $('find').value.toLowerCase();
      if (q) {
        lines.forEach((l, i) => {
          const text = l.tokens.map((t) => t[1]).join('').toLowerCase();
          const ranges = [];
          for (let k = text.indexOf(q); k !== -1; k = text.indexOf(q, k + q.length)) ranges.push([k, k + q.length]);
          if (!ranges.length) return;
          const el = view.querySelector(`.ln[data-i="${i}"]`);
          if (el) el.outerHTML = lineHtml(l, i, ranges);
          matchLines.push(i);
        });
      }
    }
    const marks = [...view.querySelectorAll('mark')].filter((m, k, all) => !(k > 0 && all[k - 1].parentElement === m.parentElement && all[k - 1].dataset.r === m.dataset.r));
    $('vm').dataset.count = marks.length;
    if (!marks.length) return;
    view.querySelectorAll('mark.current').forEach((m) => m.classList.remove('current'));
    if (step) findIndex = (findIndex + step + marks.length) % marks.length;
    const cur = marks[findIndex];
    cur.parentElement.querySelectorAll(`mark[data-r="${cur.dataset.r}"]`).forEach((m) => m.classList.add('current'));
    cur.scrollIntoView({ block: 'center' });
  }

  $('find').addEventListener('input', () => highlight());
  $('find').addEventListener('keydown', (e) => { if (e.key === 'Enter') highlight(e.shiftKey ? -1 : 1); });
  $('indent').addEventListener('click', () => { state.indent = state.indent === false; save(); paint(); });
  $('copy').addEventListener('click', () => vscode.postMessage({ type: 'copy', id: state.selected }));
  $('open').addEventListener('click', () => vscode.postMessage({ type: 'openEditor', id: state.selected }));
  $('refresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  $('follow').addEventListener('change', (e) => vscode.postMessage({ type: 'follow', value: e.target.checked }));
  $('chat').addEventListener('change', (e) => { state.selected = undefined; state.open = {}; save(); $('follow').checked = false; vscode.postMessage({ type: 'selectChat', chatId: e.target.value }); });
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
